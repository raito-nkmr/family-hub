[project]
name = "family-hub-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic~=1.18.5",
    "fastapi~=0.139.2",
    "pillow~=12.3.0",
    "pillow-heif~=1.5.0",
    "psycopg[binary]~=3.3.4",
    "pydantic-settings~=2.14.2",
    "pwdlib[argon2]~=0.3.0",
    "python-multipart~=0.0.32",
    "pywebpush~=2.3.0",
    "sqlalchemy~=2.0.51",
    "uvicorn~=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2~=2.7.0",
    "pytest~=9.1.1",
    "ruff~=0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --import-mode=importlib"
markers = ["integration: requires an explicitly configured PostgreSQL test database"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
