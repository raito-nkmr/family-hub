name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/family_hub_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/family_hub_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: family_hub_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d family_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Apply migrations to PostgreSQL
        working-directory: backend
        run: uv run --locked alembic upgrade head

      - name: Run all checks
        run: make check

  frontend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install WebKit
        working-directory: frontend
        run: npx playwright install --with-deps webkit

      - name: Run iPhone WebKit tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Run production PWA tests
        working-directory: frontend
        run: npm run test:e2e:pwa
